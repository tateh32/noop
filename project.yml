name: Strand
options:
  bundleIdPrefix: com.noopapp
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.1"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Build for both Apple Silicon and Intel so the release runs on every Mac.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Release:
      # Distribution builds must produce a universal binary, not just the host arch.
      ONLY_ACTIVE_ARCH: NO
packages:
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
targets:
  Strand:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
    info:
      path: Strand/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your Mac. Nothing leaves your device."
    entitlements:
      path: Strand/Resources/Strand.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.noop
        PRODUCT_NAME: NOOP
        PRODUCT_MODULE_NAME: Strand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Hardened Runtime closes the DYLD_INSERT_LIBRARIES injection vector for the
        # distributed (ad-hoc) build. The app uses no JIT / unsigned-exec memory, so it's safe.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
    scheme:
      testTargets:
        - StrandTests
  NOOPiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Strand
        excludes:
          - App/StrandApp.swift
          - MenuBar
          - MenuBar/**
          - Resources/Info.plist
          - Resources/Strand.entitlements
          - Resources/Assets.xcassets
      - path: StrandiOS
        excludes:
          - Resources/Info.plist
          - Resources/NOOP.entitlements
          - LiveActivity/NOOPLiveActivity.swift
          - LiveActivity/NOOPLiveActivityBundle.swift
          - LiveActivity/Info.plist
          - LiveActivity/NOOPLiveActivity.entitlements
    info:
      path: StrandiOS/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on this iPhone. Nothing leaves your device."
        NSBluetoothPeripheralUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate and sensor data locally on this iPhone. Nothing leaves your device."
        NSLocationWhenInUseUsageDescription: "NOOP uses this iPhone’s GPS during a live run, walk, ride or hike so it can record distance and pace, and keeps recording while the screen is locked. Location stays on the phone. An Apple Watch is not required."
        NSMotionUsageDescription: "NOOP reads this iPhone’s step count during a live walk, run or hike. Motion data stays on the phone."
        NSHealthShareUsageDescription: "NOOP reads your own Apple Health data on this iPhone to fill sleep and workouts. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "NOOP writes the sleep, workouts, heart rate, HRV and recovery it computes from your strap back into Apple Health, on this iPhone and only when you allow it."
    entitlements:
      path: StrandiOS/Resources/NOOP.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.noop.ios
        PRODUCT_NAME: NOOP
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - target: NOOPLiveActivity
        embed: true
      - sdk: HealthKit.framework
      - sdk: ActivityKit.framework
  NOOPLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Strand/Data/WorkoutLiveActivityState.swift
      - path: StrandiOS/LiveActivity
        excludes:
          - Info.plist
          - NOOPLiveActivity.entitlements
          - LiveActivityController.swift
    info:
      path: StrandiOS/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: NOOP
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrandiOS/LiveActivity/NOOPLiveActivity.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.noop.ios.liveactivity
        PRODUCT_NAME: NOOPLiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
  StrandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - StrandTests
    dependencies:
      - target: Strand
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandImport
      - package: StrandAnalytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.noopapp.strandtests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP.app/Contents/MacOS/NOOP"
        BUNDLE_LOADER: "$(TEST_HOST)"
